<style>
:root{--acc:#D4A017;--acc-ink:#1a1405;--bg:#ffffff;--card:#ffffff;--card2:#f4f4f5;--txt:#17171c;--sub:#5d5d66;--mut:#8b8b94;--line:#e8e8ec;--sh:0 1px 2px rgba(16,24,40,.03);
  --ok:#1f9d55;--okbg:rgba(31,157,85,.12);--warn:#b7791f;--warnbg:rgba(214,158,46,.16);--bad:#d64545;--badbg:rgba(214,69,69,.12);--info:#2f6fe4;--infobg:rgba(47,111,228,.12);--r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}

  --okbg:rgba(31,157,85,.2);--warnbg:rgba(214,158,46,.2);--badbg:rgba(214,69,69,.2);--infobg:rgba(47,111,228,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--acc)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.topin{display:flex;align-items:center;gap:10px;min-height:60px}
.logo{width:38px;height:38px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:10.5px;letter-spacing:.3px;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;padding:4px}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:16px;line-height:1.2;font-weight:600}
.ttl small{display:block;color:var(--sub);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl.tap{cursor:pointer}.ttl.brand{display:flex;flex-direction:column;align-items:flex-start}.ttl.brand .hit{cursor:pointer;max-width:100%}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--txt);text-decoration:none}
.ib svg{width:19px;height:19px}
.ib.sm{width:32px;height:32px}.ib.sm svg{width:16px;height:16px}
.av{width:38px;height:38px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--sub);overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:68px;height:68px;font-size:22px}
.av.xs{width:24px;height:24px;font-size:9.5px}.av.xs svg{width:13px;height:13px}
.t-purple{background:rgba(124,58,237,.12);color:#6d3fd6}.t-orange{background:rgba(234,122,23,.14);color:#c25f0a}.t-gold{background:rgba(212,160,23,.18);color:#9a7408}
.t-blue{background:rgba(47,111,228,.12);color:#2a62cc}.t-green{background:rgba(31,157,85,.13);color:#178048}.t-peach{background:rgba(232,102,75,.14);color:#c8492f}
.t-pink{background:rgba(219,39,119,.12);color:#c0246a}.t-gray{background:rgba(100,116,139,.13);color:#55657a}.t-red{background:rgba(214,69,69,.13);color:#c23434}.t-dark{background:#17171c;color:#fff}
[data-theme=dark] .t-purple{color:#b49bff}[data-theme=dark] .t-orange{color:#ffab5e}[data-theme=dark] .t-gold{color:#f0c53d}[data-theme=dark] .t-blue{color:#83aaff}[data-theme=dark] .t-green{color:#5fd396}
[data-theme=dark] .t-peach{color:#ff9a84}[data-theme=dark] .t-pink{color:#ff86bb}[data-theme=dark] .t-gray{color:#a6b0be}[data-theme=dark] .t-red{color:#ff8a8a}[data-theme=dark] .t-dark{background:#f3f3f5;color:#111}
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.3}
.bdg button{border:0;background:none;color:inherit;font-size:14px;line-height:1;padding:0 0 0 2px;cursor:pointer}
.bdgs{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle;margin-left:6px}
.si{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}.si svg{width:19px;height:19px}.si.sm{width:32px;height:32px;border-radius:9px}.si.sm svg{width:16px;height:16px}
.stat .si+div b{display:block;line-height:1.15}
.dgrid{display:grid;grid-template-columns:1fr;gap:18px}
.dtwo{display:grid;grid-template-columns:1fr;gap:0 14px}@media(min-width:700px){.dtwo{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.dgrid{grid-template-columns:minmax(0,1fr) 320px}.dgrid aside{position:sticky;top:80px;align-self:start}}
.cal .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:10px;text-align:center}
.cal .cg small{color:var(--mut);font-size:11px;font-weight:600;padding:2px 0}
.cal .cg span{font-size:12.5px;padding:6px 0;border-radius:9px;font-weight:500}
.cal .cg span.ev{background:color-mix(in srgb,var(--acc) 22%,transparent);font-weight:700}
.cal .cg span.today{background:var(--acc);color:var(--acc-ink);font-weight:800}
.cdot{display:inline-block;width:9px;height:9px;border-radius:3px;background:color-mix(in srgb,var(--acc) 40%,transparent);vertical-align:-1px;margin-right:4px}
.avs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.avs>div{cursor:pointer}
.donut{position:relative;width:150px;height:150px;margin:0 auto}.donut svg{width:100%;height:100%}
.donut .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.donut .dc b{font-size:17px}.donut .dc small{color:var(--mut);font-size:11px}
.leg{margin-top:12px;font-size:13px}.leg div{display:flex;align-items:center;gap:8px;padding:3px 0}.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;transition:transform .12s,box-shadow .12s}
.tc:hover{box-shadow:0 6px 20px rgba(0,0,0,.09)}.tc:active{transform:scale(.99)}
.tc .tags{display:flex;flex-wrap:wrap;gap:4px}.tags{display:flex;flex-wrap:wrap;gap:5px}
.tc .tt{font-size:16px;line-height:1.3;font-weight:500}.tc .td{color:var(--sub);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc .tf{display:flex;align-items:center;gap:6px 10px;font-size:12px;color:var(--sub);margin-top:2px;flex-wrap:wrap}.tc .tf .grow{min-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tc .tf span{white-space:nowrap}.tc .tf span{display:inline-flex;align-items:center;gap:3px}.tc .tf svg{width:13px;height:13px}
.tc.hot{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 70%,#ff8a00));border-color:transparent;color:#fff}
.tc.hot .td,.tc.hot .tf,.tc.hot .tf .red{color:rgba(255,255,255,.9)}.tc.hot .bdg{background:rgba(255,255,255,.22);color:#fff}.tc.hot .bar{background:rgba(255,255,255,.3)}.tc.hot .bar i{background:#fff}
.tc.isdone .tt{text-decoration:line-through;opacity:.6}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--card2);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.col.over{outline:2px dashed var(--acc)}.colh{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}
.stbtns{display:flex;flex-wrap:wrap;gap:8px}.stbtns .btn.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.chk.sm{width:24px;height:24px}.chk.sm svg{width:13px;height:13px}
input[type=range]{padding:0;border:0;box-shadow:none;accent-color:var(--acc)}
.tl{display:flex;flex-direction:column;gap:12px}.tli{display:flex;gap:10px;font-size:14px}
.filechip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:var(--card2);font-size:13px;color:var(--txt);text-decoration:none;max-width:220px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.filechip svg{width:16px;height:16px;flex:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
.udot{width:9px;height:9px;border-radius:50%;background:var(--acc);flex:none}
.ib.bell{position:relative}.ib.bell .dot{position:absolute;top:-4px;right:-4px}
.bdgchip{font-size:13px}
main{padding:18px 0 calc(96px + var(--safe-b))}
h1{font-size:26px;margin:4px 0 4px;line-height:1.25;font-weight:600;letter-spacing:-.02em}
h2{font-size:19px;margin:24px 0 10px;font-weight:500;letter-spacing:-.01em}
h3{font-size:15.5px;margin:0 0 4px;font-weight:600}
.sub{color:var(--sub)}.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px}
.row .grow,.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:42px;text-decoration:none;color:var(--txt);font-size:14.5px}

.btn.sm{padding:6px 12px;min-height:34px;font-size:13.5px;border-radius:9px}
.btn.full{width:100%}
.btn svg{width:17px;height:17px}
.btn:disabled{opacity:.55}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--sub);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.info{background:var(--infobg);color:var(--info)}

.dot{display:inline-flex;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:transform .12s,box-shadow .12s}
.ev:hover{box-shadow:0 8px 28px rgba(0,0,0,.12)}.ev:active{transform:scale(.985)}

.ev .cv .lg img{width:100%;height:100%;object-fit:contain;padding:8px}
.ev .cv .lg span{font-weight:800;font-size:16px}

.ev .bd{padding:13px 15px 15px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.stat small{color:var(--sub);font-size:14px;display:block;line-height:1.3;margin-top:2px}
.stat b{font-size:24px;white-space:nowrap;font-weight:600;letter-spacing:-.02em}
.stat.click{cursor:pointer}.stat.click:hover{border-color:var(--acc)}
label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
input[type=checkbox]{width:18px;height:18px;vertical-align:-3px;margin-right:6px;accent-color:var(--acc)}
textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.req:after{content:" *";color:var(--bad)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}

.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;font-size:11px;font-weight:600;color:var(--mut);cursor:pointer;border:0;background:none;position:relative}

.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 18px calc(22px + var(--safe-b));animation:up .2s}

.shead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.shead h2{flex:1;margin:6px 0}

.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;max-width:90vw;text-align:center;animation:fade .2s}

.sk{background:linear-gradient(90deg,var(--card2) 25%,color-mix(in srgb,var(--card2) 50%,var(--card)) 50%,var(--card2) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:10px}

.empty{text-align:center;padding:36px 16px;color:var(--sub)}
.empty svg{width:42px;height:42px;color:var(--mut)}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

.thumbs .add{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line);color:var(--mut)}

  {v:'2.9.1',d:'16 Nov 2026 · 9:09 PM',s:'Faster calendar, cleaner top bar, softer budget card',p:['Tap anywhere on the dashboard calendar to open the full calendar; tapping a date opens that day','The calendar now opens instantly, loading in the background','Only the OSOA logo and name go to the home page; the event name opens an event switcher','The Budget Heads card is now a soft cream and gold instead of black','Urgent, high-priority and overdue task cards gently shake after 15 seconds of inactivity']},
  {v:'2.9.0',d:'16 Nov 2026 · 8:37 PM',s:'Artist profile extras',p:['Visitors can like artworks, leave guestbook messages (approved by admins) and send commission enquiries','Artists can mark artworks for sale or Adopt an Artist; the public sees “price on request”','Artists can add food and health needs, photo and media consent, and workshop details, visible only to organisers','The committee can add tags and write feedback that the artist sees on their profile','Enquiries and guestbook messages reach admins in the app and by email, and appear in the Drive copy']},
  {v:'2.8.0',d:'16 Nov 2026 · 8:33 PM',s:'Aadhaar switch, request popups and readable Drive copy',p:['Added an app-wide Aadhaar switch for super admins; it is now off, and existing Aadhaar stays safely hidden','New volunteer, access, expense and level-change requests now pop up for approvers within a minute','Every request alert also appears in the notification panel','Added a readable copy of all data in Google Drive (My Apps › OSOA Desk › 11. Readable Data), updated hourly','Super admins can open the Drive folder or update it instantly from App settings']},
  {v:'2.7.1',d:'16 Nov 2026 · 8:28 PM',s:'Activity tab and reliable photo uploads',p:['Moved Recent Activity off the Dashboard into its own Activity tab for admins and Project Leads','Sign-up no longer loads forever: unreadable photos now show a clear message','Sign-up shows progress while preparing photos and creating the account','Any request that takes longer than 90 seconds now stops with a helpful message']},
  {v:'2.7.0',d:'16 Nov 2026 · 7:48 PM',s:'Calendar',p:['Added a full calendar that opens from the calendar icon on every screen, with Month, Week and Agenda views','Admins can post reminders and important updates in gold for everyone, a team, a role or specific people','Important updates have a Got it button, and admins can see who has seen them','Everyone can add personal entries in their own colours, with repeats and reminders by app and email','Task due dates, interviews, event days and the schedule now appear on the calendar automatically']},
  {v:'2.6.0',d:'16 Nov 2026 · 7:44 PM',s:'Artist Profile',p:['Artists can build a full profile: portfolio with details, experience, awards, art forms and social links','Every artist now has a shareable public profile page and a QR code for their name card','Added an OSOA journey timeline with event photos and videos added by volunteers','Artists can see their travel and stay details, request materials and download their certificate','Added a Verified badge, past ratings, an invite flag and a contact log for the committee']},
  {v:'2.5.0',d:'16 Nov 2026 · 7:33 PM',s:'Selection process upgrade',p:['Every committee member now rates each artist individually; the average decides the ranking','Added Review as Specialist, so one committee member can take charge of an artist','Added a screening check: link verification, photo requests and work photos uploaded by the committee','Introduced selection groups, a Ranking view and an interview checklist with verified experience and age','Added one-tap replacement of a dropped-out artist with the next backup, with emails to both']},

  var r=parseInt(c.substr(1,2),16),g=parseInt(c.substr(3,2),16),b=parseInt(c.substr(5,2),16);document.documentElement.style.setProperty('--acc-ink',(r*299+g*587+b*114)/1000>150?'#1a1405':'#ffffff');}

var PHOTO_ERR='Could not read this photo. Please take a new photo with the camera, or choose one saved on your phone (not from Google Photos / Drive cloud).';
function readImg(file,max,type){var p=new Promise(function(res,rej){if(!file)return rej('No photo chosen.');if(file.size===0)return rej(PHOTO_ERR);if(file.size>40*1024*1024)return rej('This photo is too large (over 40 MB). Please choose a smaller one.');
  if(file.type&&!/^image\//.test(file.type))return rej('Please choose a photo (JPG or PNG), not a '+(file.type.split('/')[1]||'document')+' file.');
  var r=new FileReader();r.onerror=r.onabort=function(){rej(PHOTO_ERR);};r.onload=function(){var im=new Image();im.onload=function(){var w=im.width,h=im.height,s=Math.min(1,max/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
  var x=c.getContext('2d');if(type!=='image/png'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);}x.drawImage(im,0,0,c.width,c.height);try{res(c.toDataURL(type||'image/jpeg',.85));}catch(e){rej(PHOTO_ERR);}};im.onerror=function(){rej(PHOTO_ERR);};im.src=r.result;};try{r.readAsDataURL(file);}catch(e){rej(PHOTO_ERR);}});
  return Promise.race([p,new Promise(function(res,rej){setTimeout(function(){rej(PHOTO_ERR);},30000);})]);}
function fileOf(id){var el=$(id);return el&&el.files&&el.files[0];}

function go(h){if(location.hash===h)route();else location.hash=h;}

function parts(){return location.hash.replace(/^#\/?/,'').split('/');}

  if(p[0]==='signup')return renderSignup();
  if(p[0]==='forgot')return renderForgot();
  if(p[0]==='e'&&p[1])return openEvent(p[1]);
  if(p[0]==='a'&&p[1])return renderPublicArtist(p[1]);
  if(p[0]==='browse')return renderHome(true);
  if(!S.token)return renderLogin();
  if(p[0]==='programs')return renderPrograms();
  if(p[0]==='people')return renderPeople();
  if(p[0]==='artistdb')return renderArtistDb();
  if(p[0]==='profile')return renderMyProfile();
  S.ev=null;S.data=null;S.pub=null;renderHome(false);}

function openEvent(id){
  var first=S.ev!==id;S.ev=id;if(first){S.tab='';S.sub={};S.data=null;S.pub=null;}
  var c=S.token?cacheGet('ev:'+id):null, cp=cacheGet('pub:'+id), ci=cacheGet('init');
  if(ci&&!S.programs.length){S.programs=ci.programs;S.events=ci.events;S.cats=ci.cats;}
  var e=S.events.filter(function(x){return x.eventId===id;})[0], p=e?prog(e.programId):{};
  $('app').innerHTML=shell({title:String(p.name||'One State One Artist').toUpperCase(),subtitle:'MANAGEMENT DESK'+(e?' · '+e.name:''),brand:1,color:p.color,logoId:p.logoId,short:p.short,tap:"go('#/')",sw:"eventSwitcher()"})+'<main class="wrap" id="main">'+skel(4)+'</main><div id="tabs"></div>';
  if(!S.me&&S.token)S.me=cacheGet('me');
  if(c&&cp&&S.me){S.data=c;S.pub=cp;drawEvent();}
  else if(!S.token&&cp){S.pub=cp;drawGuestShell();}

  [].forEach.call(document.querySelectorAll('.stbtns [data-s]'),function(b){b.classList.toggle('on',b.dataset.s===s);});
  if(s){$('stlab').innerHTML='New status: '+tsPill(s);$('nlab').textContent=(s==='cant'||s==='blocked')?'Reason (required)':'Note (optional)';$('nlab').className=(s==='cant'||s==='blocked')?'req':'';$('tnote').placeholder={cant:'Why can\'t this be completed?',blocked:'What help do you need?',partial:'What is done and what is left?',progress:'Any note?',todo:'Why reopen?'}[s];$('tnote').focus();$('tpost').textContent='Save status';}
  else{$('nlab').textContent='Add a note or update';$('nlab').className='';$('tpost').textContent='Post update';}}
function addTaskFiles(inp){var fs=[].slice.call(inp.files,0,5-_tfiles.length);
  Promise.all(fs.map(function(f){if(/^image\//.test(f.type))return readImg(f,1600).then(function(d){return {name:f.name.replace(/\.\w+$/,'.jpg'),type:'image/jpeg',data:d};});
    if(f.size>10*1024*1024)return Promise.reject(f.name+' is larger than 10 MB.');
    return new Promise(function(res){var r=new FileReader();r.onload=function(){res({name:f.name,type:f.type,data:r.result});};r.readAsDataURL(f);});}))
  .then(function(l){_tfiles=_tfiles.concat(l);drawTFiles();inp.value='';}).catch(function(e){toast(errMsg(e),1);});}
function drawTFiles(){$('tfl').innerHTML=_tfiles.map(function(f,i){return '<div class="tw">'+(/^image/.test(f.type)?'<img src="'+f.data+'">':'<span class="filechip">'+ic('doc')+esc(f.name)+'</span>')+'<button class="x" onclick="_tfiles.splice('+i+',1);drawTFiles()">×</button></div>';}).join('');}
function postTaskUpdate(id,b){$('err').textContent='';var note=$('tnote').value;
  if(!_pick&&!note.trim()&&!_tfiles.length){$('err').textContent='Write a note, attach a file or choose a status.';return;}
  busy(b,1);var arg={taskId:id,note:note,files:_tfiles};if(_pick){arg.status=_pick;if(_pick==='partial')arg.progress=$('pg').value;}
  A('api_updateTask',arg).then(function(d){var p=_pick;_pick='';_tfiles=[];useData(d);toast(p?'Status updated':'Update posted');openTask(id);}).catch(function(e){busy(b,0);$('err').textContent=errMsg(e);});}
function toggleCheckItem(id,i){var t=window._task.task,cl=t.checklist.map(function(x){return {text:x.text,done:x.done};});cl[i].done=!cl[i].done;
  A('api_updateTask',{taskId:id,checklist:cl}).then(function(d){useData(d);if(cl.every(function(x){return x.done;}))toast('Checklist complete — mark the task as done?');openTask(id);}).catch(function(e){toast(errMsg(e),1);});}
var _cl=[];
function taskForm(id){var d=S.data,t=id?d.tasks.filter(function(x){return x.taskId===id;})[0]:{priority:'medium'},canAll=d.sections.tasks,heads=d.myTaskTeams||d.myHeadTeams||[];_cl=(t.checklist||[]).map(function(x){return {text:x.text,done:x.done};});
  var teams=(d.teams||[]).filter(function(x){return canAll||heads.indexOf(x.teamId)>=0;}),o='';
  if(canAll){o+='<option value="">Everyone</option>';if(teams.length)o+='<optgroup label="Teams">'+teams.map(function(x){return '<option value="team:'+x.teamId+'" '+(t.teamId===x.teamId&&!t.assignedTo?'selected':'')+'>'+esc(x.name)+' team</option>';}).join('')+'</optgroup>';
    o+='<optgroup label="People">'+(d.people||[]).map(function(v){return '<option value="'+v.userId+'" '+(t.assignedTo===v.userId?'selected':'')+'>'+esc(v.name)+'</option>';}).join('')+'</optgroup>';}
  else teams.forEach(function(x){o+='<optgroup label="'+esc(x.name)+'"><option value="team:'+x.teamId+'" '+(t.teamId===x.teamId&&!t.assignedTo?'selected':'')+'>Whole team</option>'+[x.head].concat(x.members).filter(Boolean).map(function(m){return '<option value="'+x.teamId+':'+m.userId+'" '+(t.assignedTo===m.userId?'selected':'')+'>'+esc(m.fullName)+'</option>';}).join('')+'</optgroup>';});
  closeSheet();sheet(id?'Edit task':'New task','<label style="margin-top:0" class="req">Task title</label><input id="t_title" value="'+esc(t.title)+'" placeholder="e.g. Set up the registration desk"><label>Details</label><textarea id="t_detail" placeholder="What exactly needs to be done?">'+esc(t.detail)+'</textarea>'+
  '<label>Assign to</label><select id="t_to">'+o+'</select>'+
  '<label>Priority</label><div class="seg" id="t_pr">'+['low','medium','high','urgent'].map(function(p){return '<button type="button" data-p="'+p+'" class="'+(t.priority===p?'on':'')+'" onclick="[].forEach.call($(\'t_pr\').children,function(c){c.classList.remove(\'on\')});this.classList.add(\'on\')">'+(p==='urgent'?'🔥 ':'')+PR[p][0]+'</button>';}).join('')+'</div>'+
  '<div class="two"><div><label>Due date</label><input id="t_due" type="date" value="'+esc(t.due)+'"></div><div><label>Due time</label><input id="t_time" type="time" value="'+esc(t.dueTime)+'"></div></div>'+
  '<label>Checklist (small steps)</label><div id="t_cl"></div><div class="row" style="margin-top:6px"><input id="t_clnew" placeholder="Add a step and press Enter" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addCl()}"><button class="btn sm" onclick="addCl()">'+ic('plus')+'</button></div>'+
  '<div class="err" id="err"></div><button class="btn p full" style="margin-top:14px" onclick="saveTask(this,\''+(id||'')+'\')">'+(id?'Save changes':'Create task')+'</button>');drawCl();}
function drawCl(){$('t_cl').innerHTML=_cl.map(function(x,i){return '<div class="row" style="margin-bottom:6px"><span class="grow">'+(x.done?'✓ ':'• ')+esc(x.text)+'</span><button class="ib sm" onclick="_cl.splice('+i+',1);drawCl()">'+ic('x')+'</button></div>';}).join('');}

function saveTask(b,id){busy(b,1);var v=$('t_to').value,teamId='',to='',pr=document.querySelector('#t_pr .on');if($('t_clnew').value.trim())addCl();
  if(v.indexOf('team:')===0)teamId=v.slice(5);else if(v.indexOf(':')>0){teamId=v.split(':')[0];to=v.split(':')[1];}else to=v;
  A('api_saveTask',{eventId:S.ev,task:{taskId:id||undefined,title:$('t_title').value,detail:$('t_detail').value,assignedTo:to,teamId:teamId,due:$('t_due').value,dueTime:$('t_time').value,priority:pr?pr.dataset.p:'medium',checklist:_cl}}).then(function(d){closeSheet();toast(id?'Task saved':'Task created');useData(d);}).catch(function(e){busy(b,0);$('err').textContent=errMsg(e);});}
function delTask(id){if(!confirmBox('Delete this task?'))return;A('api_deleteTask',{taskId:id}).then(function(d){closeSheet();toast('Task deleted');useData(d);}).catch(function(e){toast(errMsg(e),1);});}

/* ---- DASHBOARD pieces ---- */
function greet(){var h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening';}
function statCard(label,val,icon,tone,tab){return '<div class="stat'+(tab?' click':'')+'" '+(tab?'onclick="setTab(\''+tab+'\')"':'')+'><div class="row" style="gap:10px;align-items:flex-start"><div class="si t-'+tone+'">'+ic(icon)+'</div><div class="grow"><b>'+val+'</b><small>'+label+'</small></div></div></div>';}
function miniCal(e){var s=new Date((e.startDate||new Date().toISOString().slice(0,10))+'T00:00:00'),en=new Date((e.endDate||e.startDate||'')+'T00:00:00');if(isNaN(en))en=s;
  var key=S.sub.calm||(s.getFullYear()*12+s.getMonth()),y=Math.floor(key/12),m=key%12,first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),td=new Date();td.setHours(0,0,0,0);
  var h='<div class="cal" style="cursor:pointer" onclick="openCalendar()" title="Open calendar"><div class="row"><b class="grow">'+first.toLocaleDateString('en-IN',{month:'long',year:'numeric'})+'</b><button class="ib sm" onclick="event.stopPropagation();S.sub.calm='+(key-1)+';drawEvent()" aria-label="Previous month">'+ic('back')+'</button><button class="ib sm" style="transform:scaleX(-1)" onclick="event.stopPropagation();S.sub.calm='+(key+1)+';drawEvent()" aria-label="Next month">'+ic('back')+'</button></div><div class="cg">'+['Mo','Tu','We','Th','Fr','Sa','Su'].map(function(x){return '<small>'+x+'</small>';}).join('');
  for(var i=0;i<start;i++)h+='<span></span>';
  for(var dd=1;dd<=days;dd++){var dt=new Date(y,m,dd),cls=(dt>=s&&dt<=en?'ev':'')+(dt.getTime()===td.getTime()?' today':'');h+='<span class="'+cls+'" onclick="event.stopPropagation();openCalendar(\''+ymd(dt)+'\')">'+dd+'</span>';}
  return h+'</div><div class="mut" style="margin-top:6px"><span class="cdot"></span> Event days</div></div>';}
var DON=['#D4A017','#7c3aed','#2f6fe4','#1f9d55','#ea7a17','#db2777','#14a3a3','#64748b','#e8664b'];
function donut(obj,center,sub){var ks=Object.keys(obj).filter(function(k){return obj[k]>0;}).sort(function(a,b){return obj[b]-obj[a];}),tot=ks.reduce(function(s,k){return s+obj[k];},0);
  if(!tot)return '<div class="mut">No spending yet.</div>';var off=0,C=2*Math.PI*40;
  var segs=ks.map(function(k,i){var len=obj[k]/tot*C,s='<circle r="40" cx="50" cy="50" fill="none" stroke="'+DON[i%DON.length]+'" stroke-width="14" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'"/>';off+=len;return s;}).join('');
  return '<div class="donut"><svg viewBox="0 0 100 100" style="transform:rotate(-90deg)">'+segs+'</svg><div class="dc"><b>'+esc(center)+'</b><small>'+esc(sub)+'</small></div></div><div class="leg">'+ks.slice(0,6).map(function(k,i){return '<div><i style="background:'+DON[i%DON.length]+'"></i><span class="grow">'+esc(k)+'</span><b>'+Math.round(obj[k]/tot*100)+'%</b></div>';}).join('')+'</div>';}
function ongoing(list){var l=list.filter(function(t){return t.status!=='done'&&t.status!=='cant';}).sort(function(a,b){var o={progress:0,blocked:1,partial:2,todo:3};return o[a.status]-o[b.status];}).slice(0,4);
  return l.length?'<div class="tgrid">'+l.map(function(t,i){var c=taskCard(t,i===0&&t.status==='progress');if(t.priority==='urgent'||t.priority==='high'||overdue(t))c=c.replace('class="tc','class="tc shk');return c;}).join('')+'</div>':'<div class="card mut">No open tasks. '+(S.data.sections.tasks?'<a href="javascript:taskForm()">Create one</a>':'')+'</div>';}
function myTasksBox(){var l=(S.data.tasks||[]).filter(function(t){return t.assignedTo===S.me.userId&&t.status!=='done'&&t.status!=='cant';});
  return '<div class="card"><div class="row"><b class="grow">My Tasks</b><span class="mut">'+l.length+' open</span></div>'+(l.length?l.slice(0,6).map(function(t){return '<div class="li" style="cursor:pointer" onclick="openTask(\''+t.taskId+'\')"><button class="chk sm" onclick="event.stopPropagation();quickDone(\''+t.taskId+'\')" aria-label="Mark done">'+ic('check')+'</button><div class="grow"><b style="font-weight:600">'+esc(t.title)+'</b><span class="mut '+(overdue(t)?'red':'')+'">'+(t.due?esc(dueTxt(t)):TS[t.status][0])+'</span></div></div>';}).join(''):'<div class="mut" style="padding:8px 0">Nothing assigned to you. 🎉</div>')+'</div>';}
function teamBox(){var t=S.data.teams||[],people=[];(S.data.admins||[]).forEach(function(a){people.push(a);});t.forEach(function(x){if(x.head)people.push(x.head);x.members.forEach(function(m){people.push(m);});});

  else if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}else f+=c;}
  if(f||row.length){row.push(f);rows.push(row);}return rows.filter(function(r){return r.some(function(x){return String(x).trim();});});}
var IMP_MAP=[['name',/^(full\s*)?name|artist.?name|your name/i],['email',/e-?mail/i],['mobile',/mobile|phone|whats\s*app|contact/i],['state',/state/i],['city',/city|district|town/i],['category',/category|medium|style|art\s*form|type of art/i],['artTitle',/title/i],['bio',/bio|about|describe|introduc/i],['instagram',/insta/i],['links',/artwork|upload|photo|image|drive|link|portfolio/i]];
var _imp=null;
function importForm(){_imp=null;sheet('Import from Google Form','<ol class="sub" style="margin-top:0;padding-left:18px"><li>Open your Google Form → <b>Responses</b> → <b>View in Sheets</b>.</li><li>In the sheet: <b>File → Download → Comma-separated values (.csv)</b>.</li><li>Choose that file below.</li></ol>'+
  '<input id="imp_f" type="file" accept=".csv,text/csv" onchange="readImport(this)"><div id="imp_r" style="margin-top:12px"></div>');}
function readImport(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var rows=parseCsv(String(r.result).replace(/^﻿/,''));if(rows.length<2){$('imp_r').innerHTML='<div class="err">No responses found in this file.</div>';return;}
  var hd=rows[0],map={};IMP_MAP.forEach(function(m){for(var i=0;i<hd.length;i++){if(m[1].test(hd[i])&&!Object.keys(map).some(function(k){return map[k]===i;})){map[m[0]]=i;break;}}});
  _imp=rows.slice(1).map(function(rw){var o={};Object.keys(map).forEach(function(k){o[k]=String(rw[map[k]]||'').trim();});return o;}).filter(function(o){return o.name;});
  $('imp_r').innerHTML='<div class="card"><b>'+_imp.length+' responses found</b><div class="kv" style="margin-top:8px">'+IMP_MAP.map(function(m){return '<div>'+m[0]+'</div><div>'+(map[m[0]]!==undefined?esc(hd[map[m[0]]]):'<span class="mut">not found</span>')+'</div>';}).join('')+'</div></div>'+
  (map.email===undefined&&map.mobile===undefined?'<div class="err">Could not find an email or mobile column.</div>':'<p class="mut">People already registered (same email or mobile) are skipped. New artists get an account and can log in with “Forgot password”.</p><button class="btn p full" onclick="doImport(this)">Import '+_imp.length+' artists</button>');};r.readAsText(f);}
function doImport(b){busy(b,1);var rows=_imp.slice(),tot={added:0,existing:0,skipped:0},last=null;
  (function next(){var chunk=rows.splice(0,60);if(!chunk.length){closeSheet();toast(tot.added+' added · '+tot.existing+' already there'+(tot.skipped?' · '+tot.skipped+' skipped':''));if(last)useData(last);return;}
    A('api_importArtists',{eventId:S.ev,rows:chunk}).then(function(r){tot.added+=r.added;tot.existing+=r.existing;tot.skipped+=r.skipped;last=r.data;next();}).catch(function(e){busy(b,0);toast(errMsg(e),1);});})();}

/* ============ ARTISTS DATABASE ============ */
function renderArtistDb(){adminPage('Artists Database','<div class="sk" style="height:300px"></div>');$('app').querySelector('.ttl small').textContent='All years · all events';
  (S.me?Promise.resolve():loadInit()).then(function(){return A('api_artistsDb',{});}).then(function(r){window._adb=r;drawArtistDb();}).catch(function(e){$('main').innerHTML='<div class="empty">'+ic('lock')+'<p>'+esc(errMsg(e))+'</p></div>';});}
function drawArtistDb(){var r=window._adb,all=r.artists,f=S.adb||(S.adb={q:'',st:'',cat:'',yr:''});
  var uniq=function(fn){var o={};all.forEach(function(a){[].concat(fn(a)).forEach(function(v){if(v)o[v]=1;});});return Object.keys(o).sort();};
  var l=all.filter(function(a){return (!f.st||a.state===f.st)&&(!f.cat||a.category===f.cat||a.events.some(function(e){return e.category===f.cat;}))&&(!f.yr||a.events.some(function(e){return e.year===f.yr;}))&&(!f.q||[a.fullName,a.username,a.mobile,a.email,a.city,a.state].join(' ').toLowerCase().indexOf(f.q.toLowerCase())>=0);});
  var sel=function(k,lab,vals){return '<select style="width:auto" onchange="S.adb.'+k+'=this.value;drawArtistDb()"><option value="">'+lab+'</option>'+vals.map(function(v){return '<option '+(f[k]===v?'selected':'')+'>'+esc(v)+'</option>';}).join('')+'</select>';};
  $('main').innerHTML='<h1 class="hello" style="font-size:32px">Artists <b>Database</b></h1><p class="sub" style="margin:4px 0 14px">'+all.length+' artists across all events and years.'+(r.canEdit?'':' View only.')+'</p>'+
  '<div class="row" style="flex-wrap:wrap;margin-bottom:12px"><input placeholder="Search name, mobile, email, city" value="'+esc(f.q)+'" oninput="S.adb.q=this.value;clearTimeout(window._aq);window._aq=setTimeout(drawArtistDb,300)" style="flex:1;min-width:200px">'+
  sel('st','All states',uniq(function(a){return a.state;}))+sel('cat','All categories',uniq(function(a){return [a.category].concat(a.events.map(function(e){return e.category;}));}))+sel('yr','All years',uniq(function(a){return a.events.map(function(e){return e.year;});}))+'</div>'+
  (l.length?'<div class="card" style="padding:0;overflow:auto"><table class="tbl"><tr><th></th><th>Artist</th><th>State / City</th><th>Category</th><th>Events</th><th>Contact</th></tr>'+l.map(function(a){var i=all.indexOf(a);
    return '<tr class="click" onclick="dbProfile('+i+')"><td style="width:46px">'+avatar(a)+'</td><td><b style="font-weight:500">'+esc(a.fullName)+'</b><div class="mut">@'+esc(a.username)+'</div></td><td>'+esc([a.state,a.city].filter(Boolean).join(' / '))+'</td><td>'+esc(a.category||(a.events[0]||{}).category||'')+'</td><td><div class="tags">'+a.events.slice(0,3).map(function(e){return '<span class="bdg t-'+(SG[e.stage]||SG.registered)[1]+'" title="'+esc(e.eventName)+'">'+esc(e.year)+' · '+esc((SG[e.stage]||SG.registered)[0].split(' ·')[0])+'</span>';}).join('')+'</div></td><td style="white-space:nowrap">'+esc(a.mobile||'')+'<div class="mut">'+esc(a.email||'')+'</div></td></tr>';}).join('')+'</table></div>':'<div class="empty">'+ic('palette')+'<p>No artists found.</p></div>');}
function dbProfile(i){var a=window._adb.artists[i],can=window._adb.canEdit;
  sheet('Artist profile','<div class="row" style="margin-bottom:12px">'+avatar(a,'lg')+'<div class="grow"><b style="font-size:18px">'+esc(a.fullName)+'</b><div class="mut">@'+esc(a.username)+' · '+esc([a.city,a.state].filter(Boolean).join(', '))+'</div></div>'+(can?'<button class="btn sm" onclick="dbEdit('+i+')">'+ic('edit')+'Edit</button>':'')+'</div>'+
  '<button class="btn sm" style="margin-bottom:10px" onclick="openArtistProfile(\''+a.userId+'\')">'+ic('user')+'Full profile, history & contact log</button>'+
  '<div class="card"><div class="kv"><div>Mobile</div><div>'+(a.mobile?'<a href="tel:'+esc(a.mobile)+'">'+esc(a.mobile)+'</a> · <a target="_blank" rel="noopener" href="'+waLink(a.mobile,'')+'">WhatsApp</a>':'—')+'</div><div>Email</div><div>'+esc(a.email||'—')+'</div><div>Category</div><div>'+esc(a.category||'—')+'</div><div>Instagram</div><div>'+esc(a.instagram||'—')+'</div><div>Joined</div><div>'+esc(fmtDate(String(a.createdAt||'').slice(0,10)))+'</div></div></div>'+
  (a.bio?'<p class="sub" style="white-space:pre-wrap">'+esc(a.bio)+'</p>':'')+(a.artworks.length?'<div class="gal" style="margin-bottom:12px">'+a.artworks.map(function(x){return '<div class="gi" onclick="viewImg(\''+x+'\')"><div class="im"><img src="'+img(x)+'"></div></div>';}).join('')+'</div>':'')+
  (a.links?'<div class="card"><b>Artwork links</b>'+a.links.split(/[\s,]+/).filter(function(x){return /^https?:/.test(x);}).map(function(u,k){return '<div><a target="_blank" rel="noopener" href="'+esc(u)+'">Open artwork '+(k+1)+' ↗</a></div>';}).join('')+'</div>':'')+
  '<h3 style="margin-top:14px">Events</h3><div class="card" style="padding:2px 14px">'+(a.events.length?a.events.map(function(e){return '<div class="li"><div class="grow"><b>'+esc(e.eventName)+'</b><span class="mut">'+esc(e.year)+(e.category?' · '+esc(e.category):'')+(e.artTitle?' · '+esc(e.artTitle):'')+(e.source==='import'?' · Google Form':'')+'</span></div>'+sgPill(e.stage)+'</div>';}).join(''):'<div class="mut" style="padding:10px 0">Not registered in any event yet.</div>')+'</div>');}
function dbEdit(i){var a=window._adb.artists[i];
  sheet('Edit artist','<div class="row">'+avatar(a,'lg')+'<label class="btn sm" style="margin:0">Change photo<input type="file" accept="image/*" class="hide" id="db_ph" onchange="this.parentNode.firstChild.textContent=\'Photo selected\'"></label></div>'+
  '<label class="req">Full name</label><input id="db_n" value="'+esc(a.fullName)+'"><div class="two"><div><label>Mobile</label><input id="db_m" inputmode="tel" value="'+esc(a.mobile)+'"></div><div><label>Email</label><input id="db_e" type="email" value="'+esc(a.email)+'"></div></div>'+
  '<div class="two"><div><label>State</label><input id="db_s" list="states" value="'+esc(a.state)+'"></div><div><label>City</label><input id="db_c" value="'+esc(a.city)+'"></div></div>'+
  '<div class="two"><div><label>Category</label><input id="db_cat" value="'+esc(a.category)+'"></div><div><label>Instagram</label><input id="db_ig" value="'+esc(a.instagram)+'"></div></div><label>Bio</label><textarea id="db_b">'+esc(a.bio)+'</textarea>'+statesList()+
  '<div class="err" id="err"></div><button class="btn p full" style="margin-top:14px" onclick="dbSave('+i+',this)">Save</button>');}
function dbSave(i,b){var a=window._adb.artists[i];busy(b,1);var f=fileOf('db_ph');
  (f?readImg(f,600):Promise.resolve('')).then(function(ph){return A('api_editArtist',{userId:a.userId,photo:ph||undefined,fields:{fullName:$('db_n').value,mobile:$('db_m').value,email:$('db_e').value,state:$('db_s').value,city:$('db_c').value,category:$('db_cat').value,instagram:$('db_ig').value,bio:$('db_b').value}});})
  .then(function(r){window._adb=r;closeSheet();toast('Artist saved');drawArtistDb();var k=r.artists.map(function(x){return x.userId;}).indexOf(a.userId);if(k>=0)dbProfile(k);}).catch(function(e){busy(b,0);$('err').textContent=errMsg(e);});}

/* ---- start ---- */
if(S.token){var ci=cacheGet('init');if(ci){S.programs=ci.programs;S.events=ci.events;S.cats=ci.cats;}A('api_me',{}).then(function(m){S.me=m;var t=document.querySelector('.top');if(t&&!S.ev&&parts()[0]===''){drawHome();}}).catch(function(){});}
route();
</script>
