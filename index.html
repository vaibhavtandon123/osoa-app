<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--acc:#D4A017;--acc-ink:#1a1405;--bg:#f5f3ee;--card:#ffffff;--card2:#f2efe8;--txt:#17171c;--sub:#5d5d66;--mut:#8b8b94;--line:rgba(20,16,8,.08);--sh:0 1px 2px rgba(20,16,8,.04),0 2px 8px rgba(20,16,8,.05);
  --ok:#1f9d55;--okbg:rgba(31,157,85,.12);--warn:#b7791f;--warnbg:rgba(214,158,46,.16);--bad:#d64545;--badbg:rgba(214,69,69,.12);--info:#2f6fe4;--infobg:rgba(47,111,228,.12);--r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
[data-theme=dark]{--sh:none;--bg:#0e0e10;--card:#17171a;--card2:#222226;--txt:#f3f3f5;--sub:#a8a8b2;--mut:#77777f;--line:rgba(255,255,255,.08);
  --okbg:rgba(31,157,85,.2);--warnbg:rgba(214,158,46,.2);--badbg:rgba(214,69,69,.2);--infobg:rgba(47,111,228,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 'Plus Jakarta Sans',Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--acc)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.topin{display:flex;align-items:center;gap:10px;min-height:60px}
.logo{width:38px;height:38px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:10.5px;letter-spacing:.3px;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;padding:4px}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:16px;line-height:1.2;font-weight:700}
.ttl small{display:block;color:var(--sub);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl.tap{cursor:pointer}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--txt);text-decoration:none}
.ib svg{width:19px;height:19px}
.ib.sm{width:32px;height:32px}.ib.sm svg{width:16px;height:16px}
.av{width:38px;height:38px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--sub);overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:68px;height:68px;font-size:22px}
.av.xs{width:24px;height:24px;font-size:9.5px}.av.xs svg{width:13px;height:13px}
.t-purple{background:rgba(124,58,237,.12);color:#6d3fd6}.t-orange{background:rgba(234,122,23,.14);color:#c25f0a}.t-gold{background:rgba(212,160,23,.18);color:#9a7408}
.t-blue{background:rgba(47,111,228,.12);color:#2a62cc}.t-green{background:rgba(31,157,85,.13);color:#178048}.t-peach{background:rgba(232,102,75,.14);color:#c8492f}
.t-pink{background:rgba(219,39,119,.12);color:#c0246a}.t-gray{background:rgba(100,116,139,.13);color:#55657a}.t-red{background:rgba(214,69,69,.13);color:#c23434}.t-dark{background:#17171c;color:#fff}
[data-theme=dark] .t-purple{color:#b49bff}[data-theme=dark] .t-orange{color:#ffab5e}[data-theme=dark] .t-gold{color:#f0c53d}[data-theme=dark] .t-blue{color:#83aaff}[data-theme=dark] .t-green{color:#5fd396}
[data-theme=dark] .t-peach{color:#ff9a84}[data-theme=dark] .t-pink{color:#ff86bb}[data-theme=dark] .t-gray{color:#a6b0be}[data-theme=dark] .t-red{color:#ff8a8a}[data-theme=dark] .t-dark{background:#f3f3f5;color:#111}
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.3}
.bdg button{border:0;background:none;color:inherit;font-size:14px;line-height:1;padding:0 0 0 2px;cursor:pointer}
.bdgs{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle;margin-left:6px}
.si{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}.si svg{width:19px;height:19px}.si.sm{width:32px;height:32px;border-radius:9px}.si.sm svg{width:16px;height:16px}
.stat .si+div b{display:block;line-height:1.15}
.dgrid{display:grid;grid-template-columns:1fr;gap:18px}
.dtwo{display:grid;grid-template-columns:1fr;gap:0 14px}@media(min-width:700px){.dtwo{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.dgrid{grid-template-columns:minmax(0,1fr) 320px}.dgrid aside{position:sticky;top:80px;align-self:start}}
.cal .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:10px;text-align:center}
.cal .cg small{color:var(--mut);font-size:11px;font-weight:600;padding:2px 0}
.cal .cg span{font-size:12.5px;padding:6px 0;border-radius:9px;font-weight:500}
.cal .cg span.ev{background:color-mix(in srgb,var(--acc) 22%,transparent);font-weight:700}
.cal .cg span.today{background:var(--acc);color:var(--acc-ink);font-weight:800}
.cdot{display:inline-block;width:9px;height:9px;border-radius:3px;background:color-mix(in srgb,var(--acc) 40%,transparent);vertical-align:-1px;margin-right:4px}
.avs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.avs>div{cursor:pointer}
.donut{position:relative;width:150px;height:150px;margin:0 auto}.donut svg{width:100%;height:100%}
.donut .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.donut .dc b{font-size:17px}.donut .dc small{color:var(--mut);font-size:11px}
.leg{margin-top:12px;font-size:13px}.leg div{display:flex;align-items:center;gap:8px;padding:3px 0}.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;transition:transform .12s,box-shadow .12s}
.tc:hover{box-shadow:0 6px 20px rgba(0,0,0,.09)}.tc:active{transform:scale(.99)}
.tc .tags{display:flex;flex-wrap:wrap;gap:4px}.tags{display:flex;flex-wrap:wrap;gap:5px}
.tc .tt{font-size:15px;line-height:1.3}.tc .td{color:var(--sub);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc .tf{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub);margin-top:2px}.tc .tf span{display:inline-flex;align-items:center;gap:3px}.tc .tf svg{width:13px;height:13px}
.tc.hot{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 70%,#ff8a00));border-color:transparent;color:#fff}
.tc.hot .td,.tc.hot .tf,.tc.hot .tf .red{color:rgba(255,255,255,.9)}.tc.hot .bdg{background:rgba(255,255,255,.22);color:#fff}.tc.hot .bar{background:rgba(255,255,255,.3)}.tc.hot .bar i{background:#fff}
.tc.isdone .tt{text-decoration:line-through;opacity:.6}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--card2);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.col.over{outline:2px dashed var(--acc)}.colh{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}
.stbtns{display:flex;flex-wrap:wrap;gap:8px}.stbtns .btn.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.chk.sm{width:24px;height:24px}.chk.sm svg{width:13px;height:13px}
input[type=range]{padding:0;border:0;box-shadow:none;accent-color:var(--acc)}
.tl{display:flex;flex-direction:column;gap:12px}.tli{display:flex;gap:10px;font-size:14px}
.filechip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:var(--card2);font-size:13px;color:var(--txt);text-decoration:none;max-width:220px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.filechip svg{width:16px;height:16px;flex:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
.udot{width:9px;height:9px;border-radius:50%;background:var(--acc);flex:none}
.ib.bell{position:relative}.ib.bell .dot{position:absolute;top:-4px;right:-4px}
.bdgchip{font-size:13px}
main{padding:18px 0 calc(96px + var(--safe-b))}
h1{font-size:25px;margin:4px 0 4px;line-height:1.25;font-weight:800;letter-spacing:-.02em}
h2{font-size:17px;margin:24px 0 10px;font-weight:700;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 4px;font-weight:700}
.sub{color:var(--sub)}.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px}
.row .grow,.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:42px;text-decoration:none;color:var(--txt);font-size:14.5px}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.bad{color:var(--bad)}.btn.ok{color:var(--ok)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13.5px;border-radius:9px}
.btn.full{width:100%}
.btn svg{width:17px;height:17px}
.btn:disabled{opacity:.55}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--sub);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.info{background:var(--infobg);color:var(--info)}
.badge.acc{background:color-mix(in srgb,var(--acc) 20%,transparent);color:color-mix(in srgb,var(--acc) 70%,var(--txt))}
.dot{display:inline-flex;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:transform .12s,box-shadow .12s}
.ev:hover{box-shadow:0 8px 28px rgba(0,0,0,.12)}.ev:active{transform:scale(.985)}
.ev .cv{height:170px;background:var(--acc);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:6px;text-align:center;padding:12px}
.ev .cv>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ev .cv .sh{position:absolute;inset:0;background:rgba(0,0,0,.42)}
.ev .cv .lg{position:relative;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ev .cv .lg img{width:100%;height:100%;object-fit:contain;padding:8px}
.ev .cv .lg span{font-weight:800;font-size:16px}
.ev .cv .nm{position:relative;font-size:26px;font-weight:800;letter-spacing:.06em;line-height:1}
.ev .cv .fn{position:relative;font-size:12px;opacity:.9;font-weight:500}
.ev .bd{padding:13px 15px 15px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.stat small{color:var(--sub);font-size:12.5px;display:block;line-height:1.3}
.stat b{font-size:22px;white-space:nowrap;font-weight:800;letter-spacing:-.02em}
.stat.click{cursor:pointer}.stat.click:hover{border-color:var(--acc)}
label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
input[type=checkbox]{width:18px;height:18px;vertical-align:-3px;margin-right:6px;accent-color:var(--acc)}
textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.req:after{content:" *";color:var(--bad)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabs .in{max-width:640px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;font-size:11px;font-weight:600;color:var(--mut);cursor:pointer;border:0;background:none;position:relative}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--acc)}
.tab .dot{position:absolute;top:4px;left:calc(50% + 6px)}
.tab.desk{display:none}
.sidefoot{display:none}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 18px calc(22px + var(--safe-b));animation:up .2s}
@media(min-width:700px){.sheetbg{align-items:center}.sheet{border-radius:20px;max-height:88vh}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.shead h2{flex:1;margin:6px 0}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;max-width:90vw;text-align:center;animation:fade .2s}
.toast.bad{background:var(--bad);color:#fff}
.sk{background:linear-gradient(90deg,var(--card2) 25%,color-mix(in srgb,var(--card2) 50%,var(--card)) 50%,var(--card2) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:currentColor;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:36px 16px;color:var(--sub)}
.empty svg{width:42px;height:42px;color:var(--mut)}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.thumbs img,.thumbs .add{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--card2);cursor:pointer}
.thumbs .add{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line);color:var(--mut)}
.tw{position:relative}.tw .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;border:0;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.gi{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.gi .im{aspect-ratio:1;background:var(--card2)}
.gi .im img{width:100%;height:100%;object-fit:cover;display:block}
.gi .t{padding:8px 10px}
.gi .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{border-radius:20px;overflow:hidden;background:var(--acc);color:#fff;position:relative;min-height:180px;display:flex;align-items:flex-end;padding:20px}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 20%,rgba(0,0,0,.65))}
.hero .c{position:relative}
.hero h1{color:#fff;margin:4px 0}
.cd{display:flex;gap:8px;margin-top:10px}
.cd div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 0;text-align:center;flex:1}
.cd b{font-size:20px;display:block;font-weight:800}.cd small{font-size:11px;color:var(--sub)}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li>svg{width:20px;height:20px;flex:none;color:var(--sub)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;background:none;padding:0;color:transparent}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chk svg{width:16px;height:16px}

.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.err{color:var(--bad);font-size:13.5px;margin-top:8px;min-height:1px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-top:10px}
.infobox{background:var(--infobg);color:var(--info);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.auth{max-width:440px;margin:0 auto}
.authlogo{display:flex;flex-direction:column;align-items:center;gap:8px;margin:18px 0 10px}
.authlogo .logo{width:72px;height:72px;font-size:16px}
.sw{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);cursor:pointer}
.sw.on{border-color:var(--txt)}
.menu .li{cursor:pointer}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}
.hide{display:none!important}
.bar{height:10px;border-radius:9px;background:var(--card2);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.bar i.over{background:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--sub);font-weight:600;font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--card2)}
.tbl .num,.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--line)}
.red{color:var(--bad)}.green{color:var(--ok)}
.team{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}
.team .hd{display:flex;align-items:center;gap:8px}
.team .hd b{flex:1;font-size:15.5px}
.head{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--acc) 12%,transparent);border-radius:12px;padding:8px 10px;cursor:pointer}
.head .grow b{display:block;font-size:14px}
.mem{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer}
.mem .av{width:30px;height:30px;font-size:11px}.mem .grow{font-size:14px}
.org{display:flex;flex-direction:column;align-items:center;margin-bottom:6px}
.org .line{width:2px;height:18px;background:var(--line)}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.lock{text-align:center;padding:40px 16px;max-width:460px;margin:0 auto}
.lock .ic{width:64px;height:64px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.lock .ic svg{width:28px;height:28px;color:var(--sub)}
.grantbar{display:flex;align-items:center;gap:10px;background:var(--infobg);color:var(--info);border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:600;margin-bottom:12px}
.grantbar b{font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.chart .c i{display:block;width:100%;max-width:38px;background:var(--acc);border-radius:6px 6px 0 0;min-height:2px}
.chart .c small{font-size:10.5px;color:var(--mut);white-space:nowrap}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--sub)}
.timeline{border-left:2px solid var(--line);padding-left:14px;margin-left:6px}
.timeline div{position:relative;padding:4px 0;font-size:13.5px}
.timeline div:before{content:"";position:absolute;left:-20px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.only-desk{display:none}
@media(min-width:900px){
  body.side .tabs{top:0;bottom:0;left:0;right:auto;width:236px;border-top:0;border-right:1px solid var(--line);padding:calc(78px + var(--safe-t)) 10px 0;background:var(--bg);display:flex;flex-direction:column}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function call(fn,arg){return fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fn:fn,arg:arg})}).then(function(r){return r.json();}).then(function(d){if(d&&Object.prototype.hasOwnProperty.call(d,'e'))throw d.e;return d?d.r:null;});}
function A(fn,arg){arg=arg||{};arg.token=S.token;return call(fn,arg).catch(function(e){if(/log in again|expired/i.test(String(e))){logoutLocal();go('#/');}throw e;});}

function initials(n){return String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase();}
function avatar(u,cls){return '<div class="av '+(cls||'')+'">'+(u&&u.photoId?'<img loading="lazy" src="'+img(u.photoId)+'">':esc(initials(u&&(u.fullName||u.name))))+'</div>';}
function fmtDate(d){if(!d)return '';var x=new Date(String(d).length===10?d+'T00:00:00':d);if(isNaN(x))return d;return x.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function fmtRange(a,b){return b&&b!==a?fmtDate(a)+' – '+fmtDate(b):fmtDate(a);}
function fmtTime(t){var x=new Date(t);return isNaN(x)?'':x.toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});}
function ago(t){if(!t)return '';var s=(Date.now()-new Date(t))/1000;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short'});}
function money(n){n=Math.round(Number(n)||0);return (n<0?'-':'')+'₹'+Math.abs(n).toLocaleString('en-IN');}

function statusBadge(s){var m={approved:'ok Approved',pending:'warn Pending',rejected:'bad Rejected',requested:'warn Requested',paid:'ok Paid',Upcoming:'acc Upcoming',Live:'ok Live',Completed:' Completed'}[s]||(' '+(s||''));var i=m.indexOf(' ');return '<span class="badge '+m.slice(0,i)+'">'+esc(m.slice(i+1))+'</span>';}

function cacheGet(k){try{var v=localStorage.getItem('c:'+k);return v?JSON.parse(v):null;}catch(e){return null;}}

function ic(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+(IC[n]||'')+'</svg>';}

/* ---- theme ---- */
function applyTheme(){var t=localStorage.getItem('osoa-theme')||'light';var dark=t==='dark'||(t==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',dark?'dark':'light');}
function cycleTheme(){var t=localStorage.getItem('osoa-theme')||'light';var n={light:'dark',dark:'auto',auto:'light'}[t];localStorage.setItem('osoa-theme',n);applyTheme();toast('Theme: '+{auto:'Auto (phone setting)',light:'Light',dark:'Dark'}[n]);var b=document.querySelector('.top .themebtn');if(b)b.innerHTML=ic(themeIcon());}
function themeIcon(){return document.documentElement.getAttribute('data-theme')==='dark'?'moon':'sun';}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
function setAccent(c){c=c||'#D4A017';document.documentElement.style.setProperty('--acc',c);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=c;
  var r=parseInt(c.substr(1,2),16),g=parseInt(c.substr(3,2),16),b=parseInt(c.substr(5,2),16);document.documentElement.style.setProperty('--acc-ink',(r*299+g*587+b*114)/1000>150?'#1a1405':'#ffffff');}
applyTheme();

/* ---- sheets ---- */
function sheet(title,body){closeSheet();var bg=document.createElement('div');bg.className='sheetbg';bg.id='sheetbg';
  bg.innerHTML='<div class="sheet"><div class="grab"></div><div class="shead"><h2>'+esc(title)+'</h2><button class="ib" onclick="closeSheet()" aria-label="Close">'+ic('x')+'</button></div><div id="sbody">'+body+'</div></div>';
  bg.addEventListener('click',function(e){if(e.target===bg)closeSheet();});document.body.appendChild(bg);document.body.style.overflow='hidden';}
function closeSheet(){var b=$('sheetbg');if(b)b.remove();document.body.style.overflow='';}
function viewSrc(src){var v=document.createElement('div');v.className='viewer';v.innerHTML='<img src="'+src+'">';v.onclick=function(){v.remove();};document.body.appendChild(v);}
function viewImg(id){viewSrc(img(id));}
function confirmBox(msg){return window.confirm(msg);}
function skel(n){var h='';for(var i=0;i<(n||3);i++)h+='<div class="sk" style="height:'+(i?70:110)+'px;margin-bottom:12px"></div>';return h;}

/* ---- image helpers ---- */
function readImg(file,max,type){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var w=im.width,h=im.height,s=Math.min(1,max/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
  var x=c.getContext('2d');if(type!=='image/png'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);}x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL(type||'image/jpeg',.85));};im.onerror=function(){rej('Could not read that image.');};im.src=r.result;};r.readAsDataURL(file);});}
function fileOf(id){var el=$(id);return el&&el.files&&el.files[0];}

/* ---- routing ---- */
function go(h){if(location.hash===h)route();else location.hash=h;}
window.addEventListener('hashchange',route);
function parts(){return location.hash.replace(/^#\/?/,'').split('/');}
function route(){closeSheet();document.body.classList.remove('side');var p=parts();window.scrollTo(0,0);
  if(p[0]==='signup')return renderSignup();
  if(p[0]==='forgot')return renderForgot();
  if(p[0]==='e'&&p[1])return openEvent(p[1]);
  if(p[0]==='browse')return renderHome(true);
  if(!S.token)return renderLogin();
  if(p[0]==='programs')return renderPrograms();
  if(p[0]==='people')return renderPeople();
  if(p[0]==='profile')return renderMyProfile();
  S.ev=null;S.data=null;S.pub=null;renderHome(false);}
function shell(o){
  setAccent(o.color||'#D4A017');
  var logo=o.logoId?'<div class="logo"><img src="'+img(o.logoId)+'"></div>':'<div class="logo">'+esc((o.short||'OSOA').slice(0,5))+'</div>';
  var right=(o.bell?'<button class="ib bell" onclick="openNotifs()" aria-label="Notifications">'+ic('bell')+(S.data&&S.data.unread?'<span class="dot">'+S.data.unread+'</span>':'')+'</button>':'')+'<button class="ib themebtn" onclick="cycleTheme()" aria-label="Theme">'+ic(themeIcon())+'</button>';
  right+=S.me?'<div onclick="openAccount()" style="cursor:pointer">'+avatar(S.me)+'</div>':(S.token?'':'<button class="btn sm" onclick="go(\'#/\')">Login</button>');
  return '<div class="top"><div class="wrap topin">'+(o.back?'<button class="ib" onclick="'+o.back+'" aria-label="Back">'+ic('back')+'</button>':'')+logo+
    '<div class="ttl'+(o.tap?' tap':'')+'" '+(o.tap?'onclick="'+o.tap+'"':'')+'><b>'+esc(o.title)+'</b>'+(o.subtitle?'<small>'+esc(o.subtitle)+(o.tap?' ▾':'')+'</small>':'')+'</div>'+right+'</div></div>';
}
function logoutLocal(){S.token='';S.me=null;localStorage.removeItem('osoa-token');cacheClear();}
function versionFoot(){var v=VERSIONS[0];return '<div class="v" onclick="showVersions()" title="See what is new"><b>Version '+esc(v.v)+'</b> · <span style="text-decoration:underline">What\'s new</span></div><button class="btn sm full" style="margin-top:10px" onclick="contactDev()">'+ic('mail')+'Contact developer</button>';}

/* ============ LOGIN (first screen) ============ */

function renderLogin(){
  authShell('<div class="authlogo"><div class="logo">OSOA</div><h1 style="margin:6px 0 0">Welcome back</h1><p class="sub" style="margin:0">Log in to manage your events.</p></div>'+

  '<label>Password</label><input id="f_pass" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doLogin($(\'lbtn\'))">'+
  '<div class="err" id="err"></div><button class="btn p full" id="lbtn" style="margin-top:14px" onclick="doLogin(this)">Log in</button>'+
  '<p style="text-align:center;margin:14px 0 0"><a href="#/forgot">Forgot password?</a></p></div>'+
  '<div class="card" style="text-align:center;padding:18px"><p style="margin:0 0 10px;font-weight:600">New here?</p><button class="btn full" onclick="go(\'#/signup\')">Create account</button></div>'+

  '<div class="err" id="err"></div><button class="btn p full" id="obtn" style="margin-top:14px" onclick="doOtp(this)">Verify</button></div>'+
  '<p style="text-align:center"><a href="javascript:renderLogin()">Back to login</a></p>';setTimeout(function(){var f=$('f_code');if(f)f.focus();},50);}
function doOtp(b){$('err').textContent='';busy(b,1);call('api_verifyOtp',{challenge:_otp,code:$('f_code').value,remember:$('f_rem').checked}).then(afterAuth).catch(function(e){busy(b,0);$('err').textContent=errMsg(e);});}
var _resetUser='';

function doForgot(b){$('err').textContent='';busy(b,1);

/* ============ SIGN UP (Volunteer default / Artist) ============ */
var STATES=['Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chhattisgarh','Goa','Gujarat','Haryana','Himachal Pradesh','Jharkhand','Karnataka','Kerala','Madhya Pradesh','Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Punjab','Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand','West Bengal','Andaman and Nicobar Islands','Chandigarh','Dadra and Nagar Haveli and Daman and Diu','Delhi','Jammu and Kashmir','Ladakh','Lakshadweep','Puducherry'];
var BLOOD=['A+','A-','B+','B-','AB+','AB-','O+','O-'],TSHIRT=['XS','S','M','L','XL','XXL','XXXL'];
function statesList(){return '<datalist id="states">'+STATES.map(function(s){return '<option value="'+s+'">';}).join('')+'</datalist>';}
function opts(list,sel,ph){return (ph?'<option value="">'+ph+'</option>':'')+list.map(function(x){return '<option '+(x===sel?'selected':'')+'>'+esc(x)+'</option>';}).join('');}
var _suType='volunteer';
function renderSignup(){
  authShell('<div class="authlogo"><h1 style="margin:6px 0 0">Create account</h1><p class="sub" style="margin:0">One account works for every event.</p></div>'+
  '<div class="seg" style="margin-bottom:12px"><button id="t_vol" onclick="setSuType(\'volunteer\')">Register as Volunteer</button><button id="t_art" onclick="setSuType(\'artist\')">Register as Artist</button></div>'+
  '<div class="card" style="padding:18px" id="suform"></div><p style="text-align:center">Already have an account? <a href="#/">Log in</a></p>');setSuType(_suType);}
function setSuType(t){_suType=t;$('t_vol').classList.toggle('on',t==='volunteer');$('t_art').classList.toggle('on',t==='artist');var vol=t==='volunteer';
  $('suform').innerHTML=(vol?'<div class="infobox" style="margin-top:0">Volunteers need admin approval for each event. All fields are required.</div>':'')+
  '<h3>Basic details</h3>'+
  (vol?'<label class="req">Your photo</label><input id="s_photo" type="file" accept="image/*">':'')+
  '<label class="req">Full name</label><input id="s_name" autocomplete="name">'+
  '<div class="two"><div><label class="req">Username</label><input id="s_user" autocapitalize="none" placeholder="ramesh.kumar"></div><div><label class="req">Password</label><input id="s_pass" type="password" autocomplete="new-password" placeholder="6+ characters"></div></div>'+
  '<div class="two"><div><label class="req">Mobile</label><input id="s_mob" inputmode="tel" placeholder="10 digits"></div><div><label class="req">Email</label><input id="s_email" type="email" autocapitalize="none"></div></div>'+
  '<div class="two"><div><label class="req">State</label><input id="s_state" list="states"></div><div><label class="req">City</label><input id="s_city"></div></div>'+
  (vol?volExtraFields({})+aadhaarFields(true):'')+statesList()+
  '<label style="font-weight:500;color:var(--txt);margin-top:16px"><input type="checkbox" id="s_terms">I agree that my details are stored by the organisers and used for event management.</label>'+

function volExtraFields(m){return '<h3 style="margin-top:20px">Personal details</h3>'+
  '<div class="two"><div><label class="req">Date of birth</label><input id="s_dob" type="date" value="'+esc(m.dob||'')+'"></div><div><label class="req">Blood group</label><select id="s_blood">'+opts(BLOOD,m.bloodGroup,'Choose…')+'</select></div></div>'+
  '<label class="req">Address</label><textarea id="s_addr" style="min-height:64px">'+esc(m.address||'')+'</textarea>'+
  '<div class="two"><div><label class="req">T-shirt size</label><select id="s_tshirt">'+opts(TSHIRT,m.tshirt,'Choose…')+'</select></div><div><label class="req">Skills</label><input id="s_skills" placeholder="Design, driving, anchoring…" value="'+esc(m.skills||'')+'"></div></div>'+
  '<h3 style="margin-top:20px">Emergency contact</h3>'+
  '<div class="three"><div><label class="req">Name</label><input id="s_emn" value="'+esc(m.emName||'')+'"></div><div><label class="req">Relation</label><input id="s_emr" placeholder="Father, Wife…" value="'+esc(m.emRelation||'')+'"></div><div><label class="req">Mobile</label><input id="s_emm" inputmode="tel" value="'+esc(m.emMobile||'')+'"></div></div>';}
function aadhaarFields(isNew){return '<h3 style="margin-top:20px">Aadhaar</h3><div class="mut">Only event admins can see this. Every view is recorded.</div>'+
  '<div class="two"><div><label class="'+(isNew?'req':'')+'">Aadhaar number</label><input id="s_aad" inputmode="numeric" maxlength="14" oninput="fmtAad(this)" placeholder="'+(isNew?'1234 5678 9012':'Leave empty to keep')+'"></div><div><label class="'+(isNew?'req':'')+'">Aadhaar photo</label><input id="s_aadimg" type="file" accept="image/*"></div></div>'+
  (isNew?'<label style="font-weight:500;color:var(--txt)"><input type="checkbox" id="s_consent">I give my Aadhaar for identity verification for this event.</label>':'');}
function fmtAad(el){var d=el.value.replace(/\D/g,'').slice(0,12);el.value=d.replace(/(\d{4})(?=\d)/g,'$1 ');}
function volPayload(){return {dob:$('s_dob').value,bloodGroup:$('s_blood').value,address:$('s_addr').value,tshirt:$('s_tshirt').value,skills:$('s_skills').value,emName:$('s_emn').value,emRelation:$('s_emr').value,emMobile:$('s_emm').value};}
function doSignup(b){$('err').textContent='';busy(b,1);var vol=_suType==='volunteer';
  var p={accountType:_suType,fullName:$('s_name').value,username:$('s_user').value,password:$('s_pass').value,mobile:$('s_mob').value,email:$('s_email').value,state:$('s_state').value,city:$('s_city').value,terms:$('s_terms').checked};
  if(vol){Object.assign(p,volPayload());p.aadhaarNumber=$('s_aad').value;p.consent=$('s_consent').checked;}
  Promise.all([vol&&fileOf('s_photo')?readImg(fileOf('s_photo'),600):'',vol&&fileOf('s_aadimg')?readImg(fileOf('s_aadimg'),1600):'']).then(function(r){p.photo=r[0]||undefined;p.aadhaarImage=r[1]||undefined;return call('api_signup',p);})
  .then(afterAuth).catch(function(e){busy(b,0);$('err').textContent=errMsg(e);});}

function loadInit(){return call('api_publicInit',{token:S.token}).then(function(r){S.programs=r.programs;S.events=r.events;S.cats=r.categories;S.me=r.me;if(r.me)cacheSet('me',r.me);if(!r.me&&S.token)logoutLocal();cacheSet('init',{programs:r.programs,events:r.events,cats:r.categories});return r;});}
function renderHome(guest){
  var c=cacheGet('init');if(c){S.programs=c.programs;S.events=c.events;S.cats=c.cats;}

function saveMyProfile(b,vol,needAad){$('err').textContent='';busy(b,1);

/* ============ EVENT ============ */
function openEvent(id){
  var first=S.ev!==id;S.ev=id;if(first){S.tab='';S.sub={};S.data=null;S.pub=null;}
  var c=S.token?cacheGet('ev:'+id):null, cp=cacheGet('pub:'+id), ci=cacheGet('init');
  if(ci&&!S.programs.length){S.programs=ci.programs;S.events=ci.events;S.cats=ci.cats;}
  var e=S.events.filter(function(x){return x.eventId===id;})[0], p=e?prog(e.programId):{};
  $('app').innerHTML=shell({title:p.deskName||'Event Desk',subtitle:e?e.name:'',color:p.color,logoId:p.logoId,short:p.short,tap:"go('#/')"})+'<main class="wrap" id="main">'+skel(4)+'</main><div id="tabs"></div>';
  if(!S.me&&S.token)S.me=cacheGet('me');
  if(c&&cp&&S.me){S.data=c;S.pub=cp;drawEvent();}
  else if(!S.token&&cp){S.pub=cp;drawGuestShell();}
  var pre=S.programs.length&&(!S.token||S.me)?Promise.resolve():loadInit();
  pre.then(function(){
    if(!S.token)return call('api_eventPublic',{eventId:id}).then(function(r){S.pub=r;cacheSet('pub:'+id,r);if(S.ev===id)drawGuestShell();});
    return Promise.all([A('api_eventData',{eventId:id}),call('api_eventPublic',{eventId:id})]).then(function(rs){if(S.ev!==id)return;S.data=rs[0];S.pub=rs[1];cacheSet('ev:'+id,rs[0]);cacheSet('pub:'+id,rs[1]);drawEvent();});
  }).catch(function(err){if(!S.data)$('main').innerHTML='<div class="empty">'+ic('info')+'<p>'+esc(errMsg(err))+'</p><button class="btn" onclick="go(\'#/\')">Back to events</button></div>';else toast(errMsg(err),1);});
}
function refreshShell(){var src=S.data||S.pub;var e=src.event,p=src.program||prog(e.programId);

function finReports(){var f=S.data.finance,s=f.summary,e=S.data.event;
  var tbl=function(obj,t1){var ks=Object.keys(obj).sort(function(a,b){return obj[b]-obj[a];}),tot=ks.reduce(function(x,k){return x+obj[k];},0);return '<div class="card" style="padding:0;overflow:auto"><table class="tbl"><tr><th>'+t1+'</th><th class="num">Amount</th><th class="num">%</th></tr>'+(ks.length?ks.map(function(k){return '<tr><td>'+esc(k)+'</td><td class="num">'+money(obj[k])+'</td><td class="num">'+(tot?Math.round(obj[k]/tot*100):0)+'%</td></tr>';}).join(''):'<tr><td colspan="3" class="mut">No data</td></tr>')+'<tfoot><tr><td>Total</td><td class="num">'+money(tot)+'</td><td></td></tr></tfoot></table></div>';};
  var ik={};Object.keys(s.incomeByKind).forEach(function(k){ik[KIND_NAME[k]]=s.incomeByKind[k];});
  $('fin').innerHTML='<div class="btns noprint" style="margin-bottom:12px"><button class="btn sm" onclick="exportCsv(\'expenses\')">'+ic('download')+'Expenses (Excel)</button><button class="btn sm" onclick="exportCsv(\'income\')">'+ic('download')+'Income (Excel)</button><button class="btn sm" onclick="window.print()">'+ic('print')+'Print / Save PDF</button></div>'+
  '<h2 style="margin-top:0">'+esc(e.name)+' — Income & Expenditure</h2><div class="mut">As on '+fmtDate(new Date().toISOString().slice(0,10))+'</div>'+
  '<div class="card" style="padding:0;overflow:auto;margin-top:10px"><table class="tbl"><tr><th>Statement</th><th class="num">Amount</th></tr><tr><td>Total income</td><td class="num green">'+money(s.income)+'</td></tr><tr><td>Total paid expenses</td><td class="num">'+money(s.paid)+'</td></tr><tfoot><tr><td>'+(s.income-s.paid>=0?'Surplus':'Deficit')+'</td><td class="num '+(s.income-s.paid<0?'red':'green')+'">'+money(s.income-s.paid)+'</td></tr></tfoot></table></div>'+
  '<div class="card" style="padding:0;overflow:auto"><table class="tbl"><tr><th>Balances</th><th class="num">Amount</th></tr><tr><td>Cash in hand</td><td class="num">'+money(s.cash)+'</td></tr><tr><td>Bank</td><td class="num">'+money(s.bank)+'</td></tr><tr><td>Approved but not paid</td><td class="num">'+money(s.approvedUnpaid)+'</td></tr><tr><td>Advances not settled</td><td class="num">'+money(s.advancesOut)+'</td></tr></table></div>'+
  '<h2>Income by type</h2>'+tbl(ik,'Type')+'<h2>Spent by head</h2>'+tbl(s.byHead,'Head')+'<h2>Spent by team</h2>'+tbl(s.byTeam,'Team')+'<h2>Spent by day</h2><div class="card">'+barChart(s.byDay,31)+'</div>';}
function exportCsv(which){var f=S.data.finance,rows;
  if(which==='expenses')rows=[['Date','Type','Head','Team','Vendor','Pay to','Note','Amount','Status','Requested by','Approved by','Paid from','Mode','Reject reason']].concat(f.expenses.map(function(x){return [x.date,KIND_NAME[x.kind],x.head,x.teamName,x.vendorName,x.payee,x.note,x.amount,x.status,x.requestedName,x.approvedName,x.status==='paid'?x.account:'',x.mode,x.rejectReason];}));
  else rows=[['Date','Type','From','Phone','Email','Artist (adopt)','Amount','Into','Mode','Note']].concat(f.income.map(function(i){return [i.receivedOn,KIND_NAME[i.kind],i.sourceName,i.sourcePhone,i.sourceEmail,i.artistName,i.amount,i.account,i.mode,i.note];}));
  var csv='﻿'+rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',');}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=(S.data.event.name+' '+which+'.csv').replace(/[\\\/:*?"<>|]/g,'-');document.body.appendChild(a);a.click();a.remove();}

/* ---- event create / edit ---- */
function editEvent(e){e=e||{};var isNew=!e.eventId;
  sheet(isNew?'New event':'Event settings','<label style="margin-top:0">Program</label><select id="e_prog">'+S.programs.map(function(p){return '<option value="'+p.programId+'" '+(e.programId===p.programId?'selected':'')+'>'+esc(p.name)+'</option>';}).join('')+'</select>'+
  '<label class="req">Event name</label><input id="e_name" value="'+esc(e.name)+'" placeholder="OSOA 2026 — Raipur">'+
  '<div class="two"><div><label class="req">Start date</label><input id="e_start" type="date" value="'+esc(e.startDate)+'"></div><div><label>End date</label><input id="e_end" type="date" value="'+esc(e.endDate)+'"></div></div>'+
  '<div class="two"><div><label>Time</label><input id="e_time" value="'+esc(e.time)+'" placeholder="10 AM – 6 PM"></div><div><label>Status</label><select id="e_status">'+opts(['Upcoming','Live','Completed'],e.status||'Upcoming')+'</select></div></div>'+
  '<label>Venue</label><input id="e_venue" value="'+esc(e.venue)+'"><div class="two"><div><label>City</label><input id="e_city" value="'+esc(e.city)+'"></div><div><label>State</label><input id="e_state" list="states" value="'+esc(e.state)+'"></div></div>'+
  '<label>Google Maps link</label><input id="e_map" value="'+esc(e.mapUrl)+'" placeholder="https://maps.app.goo.gl/…">'+
  '<div class="two"><div><label>Contact name</label><input id="e_cname" value="'+esc(e.contactName)+'"></div><div><label>Contact phone</label><input id="e_cphone" inputmode="tel" value="'+esc(e.contactPhone)+'"></div></div>'+
  '<label>About the event</label><textarea id="e_about">'+esc(e.about)+'</textarea><label>Cover photo</label><input id="e_cover" type="file" accept="image/*">'+
  '<label style="font-weight:500;color:var(--txt)"><input type="checkbox" id="e_pub" '+(String(e.isPublic).toUpperCase()!=='FALSE'?'checked':'')+'>Show this event to guests</label>'+
  '<label style="font-weight:500;color:var(--txt);margin-top:6px"><input type="checkbox" id="e_reg" '+(String(e.regOpen).toUpperCase()!=='FALSE'?'checked':'')+'>Registrations open</label>'+statesList()+
  '<div class="err" id="err"></div><button class="btn p full" style="margin-top:14px" onclick="saveEvent(this,\''+(e.eventId||'')+'\')">'+(isNew?'Create event':'Save')+'</button>'+
  (!isNew&&S.me.isSuper?'<button class="btn bad full" style="margin-top:8px" onclick="deleteEvent(\''+e.eventId+'\')">Delete event</button>':''));}
function saveEvent(b,id){busy(b,1);$('err').textContent='';var f=fileOf('e_cover');
  (f?readImg(f,1600):Promise.resolve('')).then(function(cv){return A('api_saveEvent',{event:{eventId:id||undefined,programId:$('e_prog').value,name:$('e_name').value,startDate:$('e_start').value,endDate:$('e_end').value,time:$('e_time').value,status:$('e_status').value,venue:$('e_venue').value,city:$('e_city').value,state:$('e_state').value,mapUrl:$('e_map').value,contactName:$('e_cname').value,contactPhone:$('e_cphone').value,about:$('e_about').value,isPublic:$('e_pub').checked,regOpen:$('e_reg').checked,cover:cv||undefined}});})
  .then(function(r){closeSheet();toast(id?'Saved':'Event created');return loadInit().then(function(){if(id)openEvent(id);else go('#/e/'+r.eventId);});}).catch(function(e){busy(b,0);$('err').textContent=errMsg(e);});}
function deleteEvent(id){if(!confirmBox('Delete this event and ALL its data (artists, teams, finance)? This cannot be undone.'))return;A('api_deleteEvent',{eventId:id}).then(function(){closeSheet();toast('Event deleted');go('#/');}).catch(function(e){toast(errMsg(e),1);});}

/* ============ SUPER ADMIN: programs + accounts ============ */
function adminPage(title,body){setAccent('#D4A017');$('app').innerHTML=shell({title:title,subtitle:'Super admin',back:"go('#/')"})+'<main class="wrap" id="main">'+body+'</main>';}
function renderPrograms(){adminPage('Programs',skel(3));(S.programs.length&&S.me?Promise.resolve():loadInit()).then(drawPrograms);}
function drawPrograms(){if(!S.me||!S.me.isSuper){$('main').innerHTML='<div class="empty">Only super admins can open this.</div>';return;}
  $('main').innerHTML='<div class="row"><h1 class="grow">Programs</h1><button class="btn p sm" onclick="progForm()">'+ic('plus')+'Add</button></div><p class="sub" style="margin:0 0 12px">Each program has its own desk name, colour and logo.</p>'+
  S.programs.map(function(p){return '<div class="card row" style="cursor:pointer" onclick="progForm(\''+p.programId+'\')"><div class="logo" style="background:'+esc(p.color)+'">'+(p.logoId?'<img src="'+img(p.logoId)+'">':esc(p.short.slice(0,5)))+'</div><div class="grow"><b>'+esc(p.deskName)+'</b><div class="mut">'+esc(p.name)+' · '+esc(p.color)+'</div></div>'+ic('edit').replace('<svg','<svg style="width:18px;color:var(--mut)"')+'</div>';}).join('');}
var COLORS=['#D4A017','#7B4BD8','#F07A1A','#14A38B','#D7263D','#2F6FE4'];
function progForm(id){var p=id?prog(id):{color:'#D4A017'};
  sheet(id?'Edit program':'New program','<label style="margin-top:0">Program name</label><input id="g_name" value="'+esc(p.name)+'" placeholder="One State One Artist"><div class="two"><div><label>Short name</label><input id="g_short" value="'+esc(p.short)+'" placeholder="OSOA"></div><div><label>Desk name</label><input id="g_desk" value="'+esc(p.deskName)+'" placeholder="OSOA Desk"></div></div>'+
  '<label>Colour</label><div class="btns" id="g_sw">'+COLORS.map(function(c){return '<div class="sw '+(p.color===c?'on':'')+'" style="background:'+c+'" onclick="$(\'g_color\').value=\''+c+'\';[].forEach.call($(\'g_sw\').children,function(x){x.classList.remove(\'on\')});this.classList.add(\'on\')"></div>';}).join('')+'</div><input id="g_color" value="'+esc(p.color)+'" style="margin-top:8px" placeholder="#D4A017">'+
  '<label>Logo (PNG with transparent background works best)</label>'+(p.logoId?'<div class="row" style="margin-bottom:8px"><div class="logo" style="background:'+esc(p.color)+';width:56px;height:56px"><img src="'+img(p.logoId)+'"></div><label style="margin:0;font-weight:500;color:var(--txt)"><input type="checkbox" id="g_rm">Remove logo</label></div>':'')+'<input id="g_logo" type="file" accept="image/png,image/*">'+
  '<div class="err" id="err"></div><button class="btn p full" style="margin-top:14px" onclick="saveProg(this,\''+(id||'')+'\')">Save</button>');}
function saveProg(b,id){busy(b,1);var f=fileOf('g_logo');
  (f?readImg(f,512,'image/png'):Promise.resolve('')).then(function(lg){return A('api_saveProgram',{program:{programId:id||undefined,name:$('g_name').value,short:$('g_short').value,deskName:$('g_desk').value,color:$('g_color').value.trim(),logo:lg||undefined,removeLogo:$('g_rm')&&$('g_rm').checked}});})
  .then(function(l){S.programs=l;var c=cacheGet('init');if(c){c.programs=l;cacheSet('init',c);}closeSheet();toast('Saved');drawPrograms();}).catch(function(e){busy(b,0);$('err').textContent=errMsg(e);});}
function renderPeople(){adminPage('All accounts',skel(4));(S.me?Promise.resolve():loadInit()).then(function(){return A('api_allUsers',{});}).then(drawPeople).catch(function(e){$('main').innerHTML='<div class="empty">'+esc(errMsg(e))+'</div>';});}
function drawPeople(l){window._people=l;$('main').innerHTML='<h1>All accounts</h1><p class="sub" style="margin:0 0 10px">'+l.length+' accounts · '+l.filter(function(u){return u.accountType==='artist';}).length+' artists · '+l.filter(function(u){return u.accountType!=='artist';}).length+' volunteers</p><input id="pq" placeholder="Search name, username, mobile, state" oninput="drawPeopleList()"><div class="card" style="padding:2px 14px;margin-top:10px" id="plist"></div>';drawPeopleList();}
function drawPeopleList(){var q=($('pq').value||'').toLowerCase(),l=window._people.filter(function(u){return !q||[u.fullName,u.username,u.mobile,u.email,u.state].join(' ').toLowerCase().indexOf(q)>=0;});
  $('plist').innerHTML=l.map(function(u){return '<div class="li"><div style="cursor:pointer" onclick="openProfile(\''+u.userId+'\')">'+avatar(u)+'</div><div class="grow" style="cursor:pointer" onclick="openProfile(\''+u.userId+'\')"><b>'+esc(u.fullName)+(u.isSuper?' <span class="badge acc">Super admin</span>':'')+(u.isDisabled?' <span class="badge bad">Disabled</span>':'')+'</b><span class="mut">@'+esc(u.username)+' · '+(u.accountType==='artist'?'Artist':'Volunteer')+(u.mobile?' · '+esc(u.mobile):'')+(u.state?' · '+esc(u.state):'')+'</span></div>'+
    '<button class="btn sm" onclick="toggleSuper(\''+u.userId+'\','+(!u.isSuper)+',this)">'+(u.isSuper?'Remove super':'Make super')+'</button><button class="btn sm '+(u.isDisabled?'ok':'bad')+'" onclick="toggleDisabled(\''+u.userId+'\','+(!u.isDisabled)+',this)">'+(u.isDisabled?'Enable':'Disable')+'</button></div>';}).join('')||'<div class="empty">No one found.</div>';}
function toggleSuper(id,v,b){if(!confirmBox(v?'Give this person full access to all events?':'Remove super admin access?'))return;busy(b,1);A('api_setSuper',{userId:id,value:v}).then(function(l){window._people=l;drawPeopleList();toast('Updated');}).catch(function(e){busy(b,0);toast(errMsg(e),1);});}
function toggleDisabled(id,v,b){if(!confirmBox(v?'Disable this account? They will be logged out.':'Enable this account?'))return;busy(b,1);A('api_setDisabled',{userId:id,value:v}).then(function(l){window._people=l;drawPeopleList();toast('Updated');}).catch(function(e){busy(b,0);toast(errMsg(e),1);});}

/* ---- start ---- */
if(S.token){var ci=cacheGet('init');if(ci){S.programs=ci.programs;S.events=ci.events;S.cats=ci.cats;}A('api_me',{}).then(function(m){S.me=m;var t=document.querySelector('.top');if(t&&!S.ev&&parts()[0]===''){drawHome();}}).catch(function(){});}
route();
</script>
